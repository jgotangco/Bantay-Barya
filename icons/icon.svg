<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Inner Coin Face Gradient -->
    <radialGradient id="coinFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Peso Symbol 3D Gold Gradient -->
    <linearGradient id="pesoSvgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Shield Clip -->
    <clipPath id="coinClip">
      <circle cx="256" cy="256" r="185"/>
    </clipPath>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Outer Protective Coin Guard Outer Ring -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="256" r="200" fill="url(#goldRing)"/>
    <circle cx="256" cy="256" r="192" fill="#1e293b"/>
    <circle cx="256" cy="256" r="186" fill="url(#coinFace)"/>
  </g>

  <!-- Decorative Coin Rim Notches (12 Dots around the perimeter) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="256" cy="72" r="6"/>
    <circle cx="348" cy="97" r="6"/>
    <circle cx="415" cy="164" r="6"/>
    <circle cx="440" cy="256" r="6"/>
    <circle cx="415" cy="348" r="6"/>
    <circle cx="348" cy="415" r="6"/>
    <circle cx="256" cy="440" r="6"/>
    <circle cx="164" cy="415" r="6"/>
    <circle cx="97" cy="348" r="6"/>
    <circle cx="72" cy="256" r="6"/>
    <circle cx="97" cy="164" r="6"/>
    <circle cx="164" cy="97" r="6"/>
  </g>

  <!-- Decorative Inner Ring Pattern -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Protective Coin Guard Shield Accent (Subtle) -->
  <path d="M 256 125 Q 350 145 350 240 Q 350 340 256 385 Q 162 340 162 240 Q 162 145 256 125 Z" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.12)" 
        stroke-width="3" />

  <!-- Philippine Peso Symbol (₱) with clean dual horizontal crossbars -->
  <g filter="url(#symbolGlow)">
    <!-- Main 'P' Stem & Loop -->
    <!-- Vertical Spine -->
    <rect x="200" y="145" width="38" height="222" rx="10" fill="url(#pesoSvgGrad)"/>
    
    <!-- Curved 'P' Bowl -->
    <path d="M 225 145 L 285 145 C 335 145 365 175 365 220 C 365 265 335 295 285 295 L 225 295 Z" 
          fill="none" 
          stroke="url(#pesoSvgGrad)" 
          stroke-width="36" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Double Crossbars for Philippine Peso ₱ -->
    <!-- Top Crossbar -->
    <rect x="156" y="192" width="200" height="24" rx="8" fill="url(#pesoSvgGrad)"/>
    
    <!-- Bottom Crossbar -->
    <rect x="156" y="244" width="200" height="24" rx="8" fill="url(#pesoSvgGrad)"/>
  </g>

  <!-- Light Sheen Highlights -->
  <path d="M 120 180 Q 256 130 392 180" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>

  <!-- Top-Right Financial Sparkle -->
  <g transform="translate(365, 140) scale(0.9)" fill="#ffffff">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" opacity="0.95"/>
  </g>
</svg>
